# ============================================================
# 方案 B（更正式）：独立子域名，走标准 443
#   访问地址：https://optical.kaypalai.com
#
# 前置条件（比方案 A 多两步）：
#   1) DNS 加一条 A 记录：optical.kaypalai.com → 服务器公网 IP
#   2) 签一张覆盖该子域名的证书，放到平台 docker/ssl/optical/
#        fullchain.pem / privkey.pem
#      certbot 示例（宿主机执行，先临时放行 80）：
#        certbot certonly --standalone -d optical.kaypalai.com
#        cp /etc/letsencrypt/live/optical.kaypalai.com/fullchain.pem <平台>/docker/ssl/optical/
#        cp /etc/letsencrypt/live/optical.kaypalai.com/privkey.pem   <平台>/docker/ssl/optical/
#      已有 *.kaypalai.com 泛域名证书的话，直接复用，跳过这步。
#   3) nginx.conf 的 http{} 里已加 include /etc/nginx/conf.d/*.conf;
#   4) optical-crm 容器已启动，且与 nginx 在同一 docker 网络
#
# 落盘位置：平台 docker/conf.d/optical.conf
# ============================================================

# HTTP 一律跳 HTTPS
server {
    listen 80;
    server_name optical.kaypalai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name optical.kaypalai.com;

    ssl_certificate     /etc/nginx/ssl/optical/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/optical/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 25M;

    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $optical_upstream http://optical:3000;
        proxy_pass $optical_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location = /api/health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $optical_upstream http://optical:3000;
        proxy_pass $optical_upstream;
        access_log off;
    }
}
