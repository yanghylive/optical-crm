# ============================================================
# 方案 A（最快上线）：复用平台现有证书，走 8443 端口
#   访问地址：https://api.kaypalai.com:8443
#
# 为什么可行：证书是签给「域名」的，与端口无关。
#   所以同一个 api.kaypalai.com 证书，在 8443 上一样有效，
#   不需要新域名、不需要新证书、不需要改 DNS。
#
# 落盘位置：平台 docker/conf.d/optical.conf
# 前置条件：
#   1) nginx.conf 的 http{} 里已加 include /etc/nginx/conf.d/*.conf;
#   2) 平台 docker-compose.yml 的 nginx 服务已挂载 ./conf.d 并发布 8443
#   3) optical-crm 容器已启动，且与 nginx 在同一 docker 网络
#   4) 云安全组 + 服务器防火墙放行 8443
# ============================================================

server {
    listen 8443 ssl;
    http2 on;
    server_name api.kaypalai.com;

    # 复用平台已有证书（与 443 同一份）
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Excel 导入上限 20MB，这里留余量
    client_max_body_size 25M;

    location / {
        # docker 内置 DNS；用变量做运行时解析，
        # 这样 optical 容器没起来时 nginx 也不会启动失败
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $optical_upstream http://optical:3000;
        proxy_pass $optical_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port  8443;

        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location = /api/health {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $optical_upstream http://optical:3000;
        proxy_pass $optical_upstream;
        access_log off;
    }
}
